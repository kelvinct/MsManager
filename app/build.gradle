plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
    id("com.google.gms.google-services")
}

android {
    namespace 'com.example.manager'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.example.manager"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        compose true
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.compose.ui.test.junit4
    debugImplementation libs.androidx.compose.ui.tooling
    debugImplementation libs.androidx.compose.ui.test.manifest

    // 扩展图标
    implementation("androidx.compose.material:material-icons-extended")

    // 协程核心库 (解决 Dispatchers / withContext)
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0")

    // Lifecycle 协程支持 (解决 lifecycleScope)
    implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.0")

    // 必须加上这个，否则 MainActivity 里的 AlertDialog 会编译报错
    implementation("androidx.appcompat:appcompat:1.7.0")

    implementation(platform("com.google.firebase:firebase-bom:34.12.0"))

    // Firebase Authentication (登录)
    implementation("com.google.firebase:firebase-auth")

    // Firebase Firestore (云数据库)
    implementation("com.google.firebase:firebase-firestore")

    //implementation("com.google.firebase:firebase-storage")  // ★ 新增，用于文件上传
    //implementation("com.amazonaws:aws-android-sdk-s3:2.75.0")
    //implementation("com.amazonaws:aws-android-sdk-core:2.75.0")

    // 添加新的 AWS SDK for Kotlin (使用 BOM 管理版本)
    implementation(platform("aws.sdk.kotlin:bom:1.3.0")) // 版本号可更新为最新
    implementation("aws.sdk.kotlin:s3")

    // Kotlin 协程支持 (如果尚未添加)
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0")
}